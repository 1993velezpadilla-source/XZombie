name: IGLESIA Clean Godot Gauntlet
on:
  push:
    branches: ["iglesia-clean-20261020"]
  workflow_dispatch:

# Every commit used to start another 250MB Android export. Never spend CI
# minutes/artifact storage building older commits after a newer patch exists.
concurrency:
  group: iglesia-church-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Zero legacy enforcement
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -name '*.tscn' | wc -l)" -eq 1
          test ! -d bukkbeek-mobile
          test ! -d xogot
          test ! -d engine
          ! grep -R -E 'load\("res://(xogot|bukkbeek-mobile|engine)/' scripts
      - name: Python dependencies
        run: python3 -m pip install --user -r requirements.txt
      - name: Generate new gothic nun MP40 + import real Tripo altar and all benches
        run: python3 tools/ingest_assets.py --with-furniture
      - name: Inspect authentic MP40 action-rig authority (REFERENCE ONLY, not export)
        run: python3 tools/audit_mp40_authority.py
      - name: Save verified weapon / hand animation source audit to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Iglesia-MP40-Genuine-Source-Pose-Audit-NOT-SHIPPABLE
          path: build/mp40-source-authority.json
          retention-days: 7
          if-no-files-found: error
      - name: Adversarial original MP40 v3 art & nun-hands gate
        run: python3 tools/qa_mp40_art_v3.py --source assets/imported/mp40 --output build/art-review/nun_mp40_v3.jpg
      - name: Publish high-res editable art visual QA on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Nun-MP40-V3-GitHub-Art-Review
          path: |
            build/art-review/nun_mp40_v3.jpg
            build/art-review/nun_mp40_v3_sha256.json
            assets/imported/mp40/nun_mp40_v3_manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Install Godot 4.6 stable
        shell: bash
        run: |
          curl -fLSs --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          /tmp/Godot_v4.6-stable_linux.x86_64 --version
      - name: Godot asset import
        run: /tmp/Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Survival room smoke gate
        run: /tmp/Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd
      - name: Actual Godot first-person HIP and ADS camera renders
        id: camera_fidelity
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y xvfb
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 150s /tmp/Godot_v4.6-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tools/capture_church.gd
          test -s build/iglesia-main-aisle-HIP.png
          test -s build/iglesia-main-aisle-ADS.png
      - name: Publish actual Godot gameplay captures for visual critique
        if: steps.camera_fidelity.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Iglesia-Actual-Godot-HIP-ADS-Camera-Frames
          path: |
            build/iglesia-main-aisle-HIP.png
            build/iglesia-main-aisle-ADS.png
          retention-days: 7
          if-no-files-found: error
      - name: Source file evidence
        if: always()
        run: |
          find assets/imported/mp40 -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort | head -24
          find . -maxdepth 4 -type f | sort | head -120

  android-preview:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true
      - name: SDK 35 packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
      - name: Disposable debug signing cert
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/iglesia-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Iglesia Development, O=Iglesia, C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/iglesia-debug.keystore" >> "$GITHUB_ENV"
      - name: Import real Tripo furniture, verified MP40 PNG/WAV and 4K albedo
        run: |
          python3 -m pip install --user -r requirements.txt
          python3 tools/ingest_assets.py --with-furniture
          timeout 240s godot --headless --path . --editor --import --quit
      - name: Native debug ARM64 export
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android ARM64" "build/Iglesia-first-playable-debug.apk" 2>&1 | tee build/export.log
          test -s build/Iglesia-first-playable-debug.apk
      - name: Verify APK ARM64 debug signature
        run: |
          set -euo pipefail
          unzip -t build/Iglesia-first-playable-debug.apk | tail -1
          unzip -Z1 build/Iglesia-first-playable-debug.apk | grep -F "lib/arm64-v8a/"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/Iglesia-first-playable-debug.apk
          sha256sum build/Iglesia-first-playable-debug.apk > build/sha256.txt
      - name: Publish phone test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Iglesia-Godot46-Android-ARM64-Preview
          path: |
            build/Iglesia-first-playable-debug.apk
            build/sha256.txt
            build/export.log
          retention-days: 14
          if-no-files-found: error
