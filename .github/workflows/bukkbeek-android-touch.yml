name: Bukkbeek Android XZIEL Touch
on:
  push:
    branches:
      - feature/bukkbeek-android-touch-v1
    paths:
      - 'bukkbeek-mobile/**'
      - '.github/workflows/bukkbeek-android-touch.yml'
  workflow_dispatch:

jobs:
  android-debug-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Get XZombie overlay
        uses: actions/checkout@v4

      - name: Java 17 for Godot Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip zip libfontconfig1 libcairo2-dev
          python3 -m pip install --break-system-packages cairosvg

      - name: Fetch pinned pristine Bukkbeek template
        run: |
          mkdir -p _build/bukkbeek
          cd _build/bukkbeek
          git init -q
          git remote add origin https://github.com/bukkbeek/GodotFPS-Template.git
          git fetch --depth=1 origin 11619794d644e7933f87caa6099f3acc1f085f5d
          git checkout --detach FETCH_HEAD

      - name: Render XZIEL official touch PNGs and apply Android adapter
        run: |
          mkdir -p _build/bukkbeek/mobile/icons
          mkdir -p _build/bukkbeek/tools
          cp bukkbeek-mobile/mobile/touch_hud.gd _build/bukkbeek/mobile/touch_hud.gd
          curl --fail --location --retry 3 -o /tmp/build_xziel_icons.py \
            https://raw.githubusercontent.com/1993velezpadilla-source/config-old-3/751c98b6aab15dbf9d071e83179868bc8d839ce9/scripts/build_xziel_icons.py
          python3 /tmp/build_xziel_icons.py _build/bukkbeek/mobile/icons
          python3 bukkbeek-mobile/patch_bukkbeek.py _build/bukkbeek
          test -s _build/bukkbeek/mobile/icons/joystick_ring.png
          test -s _build/bukkbeek/mobile/icons/touch_fire_idle.png
          test -s _build/bukkbeek/mobile/icons/adsfire.png
          test -s _build/bukkbeek/resources/player/fps_demo_arms.glb
          test -s _build/bukkbeek/resources/undead/fps_demo_undead.glb

      - name: Install Godot 4.6 editor and Android templates
        run: |
          mkdir -p _tools/godot
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d _tools/godot
          chmod +x _tools/godot/Godot_v4.6-stable_linux.x86_64
          echo "$GITHUB_WORKSPACE/_tools/godot" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          curl --fail --location --retry 3 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-export
          cp /tmp/godot-export/templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"

      - name: Configure Android SDK, debug signing, and import
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/_tools/android-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          keytool -genkeypair -noprompt -v -keystore _tools/android-debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=XZIEL Mobile Test, OU=Dev, O=XZIEL, C=PR"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          timeout 180s _tools/godot/Godot_v4.6-stable_linux.x86_64 --headless --path _build/bukkbeek --import

      - name: Export debug Android arm64 APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/_tools/android-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p _build/bukkbeek/build
          _tools/godot/Godot_v4.6-stable_linux.x86_64 --headless \
            --path _build/bukkbeek --export-debug "Android" \
            "$GITHUB_WORKSPACE/_build/bukkbeek/build/bukkbeek_xziel_touch_arm64.apk"
          test -s _build/bukkbeek/build/bukkbeek_xziel_touch_arm64.apk

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bukkbeek-XZIEL-Touch-Android-ARM64
          path: _build/bukkbeek/build/bukkbeek_xziel_touch_arm64.apk
          retention-days: 14

      - name: Upload assembled full Godot project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bukkbeek-XZIEL-Touch-Godot-Source
          path: |
            _build/bukkbeek/
            !_build/bukkbeek/.godot/
            !_build/bukkbeek/.git/
            !_build/bukkbeek/build/
          retention-days: 14
